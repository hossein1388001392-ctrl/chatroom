<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatRoom</title><link rel="stylesheet" href="style.css"></head><body>
<div id="gate" class="box"><h1>🔐 ChatRoom</h1><p>رمز ورود را وارد کن</p><input id="code" type="password" placeholder="رمز ورود"><button onclick="access()">ورود</button><p id="err"></p></div>
<div id="auth" class="box hide"><h1>👤 حساب کاربری</h1><button onclick="mode='reg'">ساخت حساب</button><button onclick="mode='login'">ورود</button><input id="user" placeholder="نام کاربری"><input id="pass" type="password" placeholder="رمز حساب"><button onclick="auth()">ادامه</button><p id="aerr"></p></div>
<div id="chat" class="hide"><header>💬 ChatRoom <span id="me"></span><button onclick="logout()">خروج</button></header><div class="layout"><aside><button onclick="room='general';load()">🌐 عمومی</button><h3>کاربران</h3><div id="users"></div></aside><main><h3 id="title">عمومی</h3><div id="messages"></div><div class="send"><input id="text" placeholder="پیام..." onkeydown="if(event.key==='Enter')send()"><input id="file" type="file" accept="image/*,video/*,audio/*"><button onclick="sendFile()">📎</button><button onclick="voice()">🎙️</button><button onclick="send()">ارسال</button></div></main></div></div>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
