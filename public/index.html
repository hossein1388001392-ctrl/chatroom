<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>ChatRoom</title>

<script src="/socket.io/socket.io.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:Tahoma,Arial,sans-serif;
  background:#071218;
  color:#fff;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hide{
  display:none!important;
}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:min(420px,100%);
  background:#16252d;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 40px #0008;
}

.card h1{
  text-align:center;
  margin-top:0;
}

.input{
  width:100%;
  padding:15px;
  margin:7px 0;
  border:0;
  outline:0;
  border-radius:14px;
  background:#263942;
  color:#fff;
  font-size:16px;
}

.btn{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:14px;
  background:#00b894;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.error{
  color:#ff7675;
  text-align:center;
  min-height:25px;
}

.app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:78px;
  min-height:78px;
  background:#1c2d35;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  font-size:19px;
  border-bottom:1px solid #263d46;
}

header button{
  border:0;
  background:#00b894;
  color:#fff;
  width:58px;
  height:45px;
  border-radius:25px;
  font-size:22px;
}

.content{
  flex:1;
  display:flex;
  min-height:0;
}

aside{
  width:270px;
  background:#101e25;
  padding:12px;
  border-left:1px solid #20333b;
  overflow-y:auto;
}

aside button{
  width:100%;
  border:0;
  padding:13px;
  margin-bottom:9px;
  border-radius:13px;
  background:#263942;
  color:#fff;
  font-size:15px;
}

aside h4{
  margin:15px 8px;
  color:#b7c6cc;
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
  min-height:0;
  position:relative;
}

#title{
  padding:15px;
  text-align:center;
  background:#16262e;
  font-size:18px;
}

.homeBtn{
  position:absolute;
  left:10px;
  top:7px;
  width:42px!important;
  height:42px;
  border:0;
  border-radius:50%;
  background:#00b894;
  color:#fff;
  font-size:20px;
}

#contacts{
  padding:10px;
  overflow-y:auto;
  flex:1;
}

.sectionTitle{
  font-size:20px;
  font-weight:bold;
  padding:12px;
}

.chatitem{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px;
  margin-bottom:8px;
  background:#172930;
  border-radius:16px;
  cursor:pointer;
}

.chatitem:active{
  transform:scale(.99);
}

.generalItem{
  background:#00a884;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#263b43;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.chatinfo{
  min-width:0;
}

.chatname{
  font-size:16px;
  font-weight:bold;
}

.lastmsg{
  color:#aebcc1;
  margin-top:5px;
  font-size:13px;
}

.smallItem{
  padding:9px;
}

.smallItem .avatar{
  width:38px;
  height:38px;
  min-width:38px;
  font-size:18px;
}

#messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
  scroll-behavior:smooth;
}

.loading{
  text-align:center;
  color:#9eafb5;
  padding:30px;
}

.bubble{
  max-width:78%;
  width:max-content;
  min-width:90px;
  margin:7px 0;
  padding:9px 12px 7px;
  border-radius:15px;
  background:#253942;
  clear:both;
}

.bubble.mine{
  margin-right:0;
  margin-left:auto;
  background:#006b5a;
}

.bubble.theirs{
  margin-left:0;
  margin-right:auto;
}

.bubbleTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.bubble small{
  color:#d7e2e5;
}

.moreBtn{
  background:transparent;
  color:#bfcdd1;
  border:0;
  font-size:20px;
  padding:0;
}

.messageText{
  margin-top:5px;
  white-space:pre-wrap;
  word-break:break-word;
}

.time{
  color:#aebec2;
  font-size:10px;
  margin-top:5px;
  text-align:left;
}

.messageImage{
  display:block;
  max-width:240px;
  max-height:300px;
  border-radius:12px;
  margin:4px 0;
}

audio{
  max-width:240px;
}

.fileLink{
  color:#fff;
}

.send{
  min-height:70px;
  padding:10px;
  background:#172a32;
  display:flex;
  align-items:center;
  gap:8px;
}

#text{
  flex:1;
  min-width:0;
  border:0;
  outline:0;
  border-radius:25px;
  padding:14px 18px;
  background:#263942;
  color:#fff;
  font-size:15px;
}

.send button{
  width:52px;
  height:52px;
  min-width:52px;
  border:0;
  border-radius:50%;
  background:#00b894;
  color:white;
  font-size:23px;
}

@media(max-width:700px){
  aside{
    display:none;
  }

  header{
    height:72px;
    min-height:72px;
  }

  .bubble{
    max-width:88%;
  }
}
</style>
</head>

<body>

<section id="gate" class="screen">
  <div class="card">
    <h1>🔐 ChatRoom</h1>
    <p style="text-align:center">رمز ورود را وارد کنید</p>

    <input
      id="code"
      class="input"
      type="password"
      placeholder="رمز ورود">

    <button class="btn" onclick="access()">
      ورود
    </button>

    <div id="err" class="error"></div>
  </div>
</section>

<section id="auth" class="screen hide">
  <div class="card">
    <h1 id="authTitle">ساخت حساب</h1>

    <input
      id="user"
      class="input"
      placeholder="نام کاربری"
      autocomplete="username">

    <input
      id="pass"
      class="input"
      type="password"
      placeholder="رمز عبور"
      autocomplete="current-password">

    <button
      id="authButton"
      class="btn"
      onclick="auth()">
      ثبت نام
    </button>

    <button
      id="modeButton"
      class="btn"
      style="background:#263942"
      onclick="switchMode()">
      حساب دارم
    </button>

    <div id="aerr" class="error"></div>
  </div>
</section>

<section id="chat" class="hide app">

<header>
  <div>💬 ChatRoom</div>

  <div id="me">@کاربر</div>

<button id="adminBtn" class="hide" onclick="openAdmin()" title="مدیریت">
👑
</button>

  <button onclick="logout()" title="خروج">
    🚪
  </button>
</header>

<div class="content">

  <aside>

    <button onclick="showHome()">
      🏠 گفتگوها
    </button>

    <button onclick="openGeneral()">
      🌐 عمومی
    </button>

    <h4>کاربران</h4>

    <div id="chatlist"></div>

    <button onclick="support()">
      🛠 پشتیبانی
    </button>

  </aside>

  <main>

    <div id="title">گفتگوها</div>

    <button
      class="homeBtn"
      onclick="showHome()">
      🏠
    </button>

    <div id="contacts"></div>

    <div id="messages" style="display:none"></div>

    <div class="send">

      <button
        onclick="send()"
        title="ارسال">
        ➤
      </button>

      <button
        onclick="voice()"
        title="ضبط صدا">
        🎙️
      </button>

      <button
        onclick="$('file').click()"
        title="ارسال فایل">
        📎
      </button>

      <input
        id="file"
        type="file"
        hidden
        onchange="sendFile()">

      <input
        id="text"
        placeholder="پیام بنویس..."
        autocomplete="off"
        onkeydown="if(event.key==='Enter')send()">

    </div>

  </main>

</div>

<footer style="
text-align:center;
padding:10px;
background:#101e25;
color:#9eafb5;
font-size:12px;">
ساخته شده توسط حسین کاوندی
</footer>

</section>

<script src="/app.js"></script>



<div id="admin" class="hide">

<h2>👑 مدیریت کاربران</h2>

<input id="adminCode" placeholder="رمز مدیر">

<button onclick="loadAdmin()">
نمایش کاربران
</button>

<div id="adminUsers"></div>

</div>


</body>
</html>
