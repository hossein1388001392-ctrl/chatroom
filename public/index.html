<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatRoom</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="gate" class="box">
<h1>🔐 ChatRoom</h1>
<p>رمز ورود سایت</p>
<input id="code" type="password" placeholder="رمز ورود">
<button onclick="access()">ورود</button>
<p id="err"></p>
</div>


<div id="auth" class="box hide">
<h1>👤 حساب کاربری</h1>

<input id="user" placeholder="نام کاربری">
<input id="pass" type="password" placeholder="رمز حساب">

<button onclick="mode='reg';auth()">ساخت حساب</button>
<button onclick="mode='login';auth()">ورود</button>

<p id="aerr"></p>
</div>


<div id="chat" class="hide app">

<header>
<div>💬 ChatRoom</div>
<div id="me"></div><button onclick="logout()">🚪</button>
</header>


<div id="chatlist" class="chatlist"></div>
<div class="content">

<aside>
<button onclick="room='general';load()">🌐 عمومی</button>

<h4>کاربران</h4>
<div id="chatlist" class="chatlist"></div>

<button onclick="support()">🛠 پشتیبانی</button>
</aside>


<main>

<div id="title">گفتگو</div><button onclick="home()">🏠</button>

<div id="contacts" class="chatlist"></div>
<div id="messages"></div>


<div class="send">

<input id="text" placeholder="پیام بنویس..." 
onkeydown="if(event.key==='Enter')send()">

<input id="file" type="file" hidden>

<button onclick="document.getElementById('file').click()">📎</button>

<button onclick="voice()">🎙</button>

<button onclick="send()">➤</button>

</div>

</main>

</div>


<footer>
ساخته شده توسط حسین کاوندی
</footer>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
